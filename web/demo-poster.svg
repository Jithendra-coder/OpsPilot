  <path d="M145 892h1630" stroke="url(#line)" stroke-width="3" opacity=".55"/>
  <circle cx="145" cy="892" r="6" fill="#92c5a1"/><circle cx="558" cy="892" r="6" fill="#92c5a1"/><circle cx="970" cy="892" r="6" fill="#92c5a1"/><circle cx="1382" cy="892" r="6" fill="#92c5a1"/><circle cx="1775" cy="892" r="6" fill="#92c5a1"/>
