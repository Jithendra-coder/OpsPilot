global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: checkout-demo
    static_configs:
      - targets: [checkout-demo:8081]
        labels:
          service_id: checkout
  - job_name: opspilot-api
    static_configs:
      - targets: [otel-collector:9464]
