route:
  receiver: opspilot
  group_by: [alertname, service_id]
  group_wait: 1s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: opspilot
    webhook_configs:
      - url: http://opspilot:8080/api/v1/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/opspilot-alert-token
